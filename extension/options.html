<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ClassLens Settings</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 40px auto; color: #1a1a1a; }
    h1 { font-size: 18px; }
    label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 20px; padding: 10px 18px; background: #1E7A46; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .note { font-size: 12px; color: #777; margin-top: 4px; }
    #status { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>ClassLens Settings</h1>
  <p class="note">These settings are normally pushed automatically by school IT via Chrome device policy. Manual entry here is for testing/demo devices only.</p>

  <label>Server URL</label>
  <input id="serverUrl" placeholder="http://localhost:4000" />

  <label>Enrollment Key</label>
  <input id="enrollmentKey" placeholder="Provided by school IT" />

  <label>Classroom</label>
  <input id="classroom" placeholder="Room 204" />

  <label>Student Name (optional label)</label>
  <input id="studentName" placeholder="Jane D." />

  <button id="save">Save & Reconnect</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
