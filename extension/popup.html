<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ClassLens</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1E7A46;
      flex-shrink: 0;
    }
    p {
      font-size: 12.5px;
      line-height: 1.5;
      color: #444;
      margin: 6px 0;
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="status"><span class="dot"></span> Monitoring is active</div>
  <p>This device is managed by your school. Site activity and periodic screenshots of your active tab are visible to school staff while you're logged in.</p>
  <p id="deviceInfo" style="color:#666"></p>
  <div class="footer">ClassLens for school-managed Chromebooks</div>
  <script src="popup.js"></script>
</body>
</html>
